[project]
name = "recommender-system"
version = "0.1.0"
description = "TMDB movie recommender with FastAPI and Gradio interfaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "gradio>=4.0.0",
    "joblib>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
